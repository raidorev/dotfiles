[backdrop]
blur_intensity = 0.5
enabled = true
tint_intensity = 0.29999999999999999

[bar.default]
center = [ "active_window" ]
concave_edge_corners = true
end = [ "keyboard_layout", "group:g1", "recorder", "group:g2", "group:g3", "group:g4", "battery", "session" ]
margin_ends = 0
radius = 12
radius_top_left = 0
radius_top_right = 0
start = [ "launcher", "weather", "sysmon", "workspaces", "media", "cat", "bar", "widget" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "tray", "notifications", "clipboard" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "volume", "brightness" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "date", "clock" ]
    opacity = 1.0
    padding = 6.0

[brightness]
enable_ddcutil = false
minimum_brightness = 0.01

[dock]
auto_hide = true
background_opacity = 1.0
enabled = true
reserve_space = false

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 300

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 350

[location]
address = "St Petersburg"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "HDMI-A-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 1.0
offset_x = 8
position = "bottom_right"

[osd]
background_opacity = 1.0

[plugins]
enabled = [ "noctalia/bongocat", "noctalia/screen_recorder", "noctalia/umbriel-companion", "thepunkoff/pomodoro" ]

[shell]
font_family = "Noto Sans"
niri_overview_type_to_launch_enabled = true
telemetry_enabled = true
umbriel_overview_type_to_launch_enabled = true

    [shell.launcher]
    compact = true

    [shell.panel]
    open_near_click_control_center = true
    open_near_click_launcher = true

    [shell.screenshot]
    annotate = true

    [shell.window_switcher]
    mru = true

[theme]
builtin = "Catppuccin"
custom_palette = "stylix"
mode = "dark"
pure_black_dark = true
source = "custom"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/raidorev/Pictures/Wallpapers"
enable = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/raidorev/Pictures/Wallpapers/jupiter.png"

    [wallpaper.last]
    path = "/home/raidorev/Pictures/Wallpapers/jupiter.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/raidorev/Pictures/Wallpapers/jupiter.png"

[widget.bar]
type = "noctalia/umbriel-companion:bar"

[widget.bluetooth]
show_label = true

[widget.cat]
audio_spectrum = true
tappy_mode = true
type = "noctalia/bongocat:cat"
use_mpris_filter = true

[widget.launcher]
glyph = "cat"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.widget]
type = "thepunkoff/pomodoro:widget"

[widget.workspaces]
empty_color = "surface"
occupied_color = "surface"
