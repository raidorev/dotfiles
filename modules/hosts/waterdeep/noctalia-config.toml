[backdrop]
blur_intensity = 0.5
enabled = true
tint_intensity = 0.3

[bar.default]
center = ["active_window"]
concave_edge_corners = true
end = [
    "keyboard_layout",
    "group:g2",
    "recorder",
    "group:g3",
    "group:g4",
    "group:g5",
    "session",
]
margin_ends = 100
radius = 12
radius_top_left = 12
radius_top_right = 12
padding = 8
start = [
    "launcher",
    "weather",
    "sysmon",
    "workspaces",
    "group:g1",
    "bar",
    "widget",
    "caffeine",
]

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "g1"
members = ["media", "cat"]
opacity = 1.0

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "g2"
members = ["tray", "notifications", "clipboard"]
opacity = 1.0

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "g3"
members = ["network", "bluetooth"]
opacity = 1.0

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "g4"
members = ["volume", "brightness"]
opacity = 1.0

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "g5"
members = ["date", "clock"]
opacity = 1.0

[brightness]
enable_ddcutil = true
minimum_brightness = 0.01

[calendar]

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = []

[desktop_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[desktop_widgets.widget]

[dock]
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 12
radius_top_right = 12
auto_hide = false
background_opacity = 1.0
enabled = true
reserve_space = false
smart_auto_hide = true

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 300

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 350

[location]
address = "Belgrade"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@WL-1", "lockscreen-login-box@DP-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
box_height = 196.0
box_width = 720.0
cx = 1280.0
cy = 1321.0
output = "DP-1"
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
background_color = "surface_container"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[lockscreen_widgets.widget."lockscreen-login-box@WL-1"]
box_height = 196.0
box_width = 810.0
cx = 640.0
cy = 1204.0
output = "WL-1"
placement_height = 1386.0
placement_width = 1280.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@WL-1".settings]
background_color = "surface_container"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[nightlight]
enabled = true
temperature_night = 4300

[notification]
background_opacity = 1.0
offset_x = 8
position = "bottom_right"

[osd]
offset_x = 8
background_opacity = 1.0

[plugin_settings."avivbintangaringga/nix-monitor"]
update_command = "nix flake update --flake /etc/nixos && nh os switch"

[plugins]
enabled = [
    "noctalia/timer",
    "noctalia/screen_recorder",
    "rxtsel/portctl",
    "thepunkoff/pomodoro",
    "radimous/prismlauncher-instances",
    "noctalia/bitwarden",
    "noctalia/bongocat",
    "avivbintangaringga/nix-monitor",
    "noctalia/translator",
    "cleboost/zed-provider",
    "noctalia/umbriel-companion",
]

[shell]
font_family = "Noto Sans"
launch_apps_as_systemd_services = true
niri_overview_type_to_launch_enabled = true
settings_expand_all_groups = true

[shell.greeter_sync]
privilege_command = "ghostty -e pkexec"

[shell.panel]
open_near_click_control_center = true
open_near_click_launcher = true
session_placement = "floating"
session_position = "center"

[shell.screen_corners]
enabled = true
size = 12

[shell.screenshot]
confirm_region = true

[shell.window_switcher]
mru = true

[theme]
builtin = "Catppuccin"
custom_palette = "stylix"
mode = "dark"
source = "custom"

[theme.templates]
enable_builtin_templates = false
enable_community_templates = false

[wallpaper]
directory = "/home/raidorev/Pictures/Wallpapers"
enabled = true

[wallpaper.automation]
enabled = true

[wallpaper.default]
path = "/home/raidorev/Pictures/Wallpapers/berries-1.jpg"

[wallpaper.last]
path = "/home/raidorev/Pictures/Wallpapers/berries-1.jpg"

[wallpaper.monitors.DP-1]
path = "/home/raidorev/Pictures/Wallpapers/berries-1.jpg"

[widget.active_window]
max_length = 554

[widget.bar]
type = "noctalia/umbriel-companion:bar"

[widget.cat]
audio_spectrum = true
interactive = false
tappy_mode = true
type = "noctalia/bongocat:cat"
use_mpris_filter = true

[widget.launcher]
glyph = "cat"

[widget.media]
max_length = 260

[widget.nix-monitor]
colorize_glyph = false
show_text = false
type = "avivbintangaringga/nix-monitor:nix-monitor"
update_available_color = "secondary"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.sysmon]
capsule = true
font_scale = 1.02
scale = 1.1000000000000001
show_cpu_cores = true

[widget.tray]
capsule = true

[widget.widget]
type = "thepunkoff/pomodoro:widget"

[widget.workspaces]
empty_color = "surface"
occupied_color = "surface"
